name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Test, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        # --passWithNoTests keeps CI green if the vitest suite hasn't landed yet
        run: npx vitest run --passWithNoTests

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
